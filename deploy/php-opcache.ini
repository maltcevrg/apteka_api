; /etc/php/8.3/fpm/conf.d/99-apteka-opcache.ini
; Скомпилированный код держится в памяти и не перепроверяется на каждом запросе.
; После обновления кода: sudo systemctl reload php8.3-fpm

opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=off

; Realpath-кэш: меньше обращений к диску
realpath_cache_size=4096K
realpath_cache_ttl=600
