# /etc/nginx/sites-available/lek-torg.ru
# HTTPS-блок добавит certbot (см. docs/12-pereezd-na-vps.md, шаг 7)

server {
    listen 80;
    listen [::]:80;
    server_name lek-torg.ru www.lek-torg.ru;

    root /var/www/apteka_api/public;
    index index.php;

    charset utf-8;
    client_max_body_size 2m;

    access_log /var/log/nginx/lek-torg.ru.access.log;
    error_log  /var/log/nginx/lek-torg.ru.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Запретить доступ к скрытым файлам (.env, .git и т.п.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Веб-страниц нет — favicon и robots не логировать
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
