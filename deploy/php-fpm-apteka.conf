; /etc/php/8.3/fpm/pool.d/www.conf — заменить содержимое этим файлом
; Главное отличие от хостинга: процессы живут постоянно, OPcache не сбрасывается.

[www]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Постоянные процессы. При 1 ГБ памяти 4 процессов по ~50 МБ достаточно
; для 40 аптек (в пике 0,04 одновременных запроса по отчёту).
pm = static
pm.max_children = 4
pm.max_requests = 1000

; Медленные запросы (>2 с) — в журнал, чтобы видеть проблемы
slowlog = /var/log/php8.3-fpm-slow.log
request_slowlog_timeout = 2s

php_admin_value[error_log] = /var/log/php8.3-fpm-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 128M
php_admin_flag[expose_php] = off
